<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#070A11"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#F59E0B" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Glowing Rings & Accents -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Center Download & Radio Broadcast Icon Matrix -->
  <!-- Downloader Arrow Shape with 4K Glow -->
  <g filter="url(#glow)">
    <!-- Main Arrow Shield Body -->
    <path d="M 256 120 L 256 310 M 180 240 L 256 316 L 332 240" fill="none" stroke="url(#primaryGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Base Plate / Tray -->
    <path d="M 150 350 L 150 380 Q 150 400 170 400 L 342 400 Q 362 400 362 380 L 362 350" fill="none" stroke="url(#cyanGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Lightning / AI Spark -->
    <polygon points="256,150 240,200 270,200 250,260 285,190 255,190" fill="#F59E0B"/>
  </g>

  <!-- Broadcast Radio Waves Symbol in Upper Right -->
  <path d="M 370 120 A 45 45 0 0 1 415 165" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <path d="M 390 100 A 70 70 0 0 1 460 170" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <circle cx="345" cy="145" r="8" fill="#EF4444"/>

  <!-- PIPO PRO Badge in Lower Section -->
  <rect x="186" y="425" width="140" height="34" rx="10" fill="#F59E0B" opacity="0.95"/>
  <text x="256" y="448" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#000000" text-anchor="middle" letter-spacing="2">PIPO PRO</text>
</svg>
